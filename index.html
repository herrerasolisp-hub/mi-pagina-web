<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de URLs - Reto B02</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Verificador de URLs</h1>
    </header>

    <main>
        <section class="container">
            <p>Ingresa una dirección URL para verificar si es válida y existe.</p>

            <div class="input-group">
                <input type="url" id="urlInput" placeholder="https://ejemplo.com" required>
                <button id="verifyBtn">Verificar URL</button>
            </div>

            <div id="resultArea" class="result-box"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Proyecto Individual de Desarrollo Web</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
